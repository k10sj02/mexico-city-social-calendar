[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cdmx-social-calendar"
version = "0.1.0"
description = "Automated Mexico City social and culture calendar"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "icalendar>=6.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
build-calendar = "cdmx_social_calendar.build:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

